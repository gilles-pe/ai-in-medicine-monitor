<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c3540">
  <meta name="description" content="AI in medicine: milestones, benchmark results and original studies.">
  <title>AI in Medicine Monitor</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./editorial.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div class="shell" id="top">
  <header class="masthead"><a class="brand" href="#top">GILLES PENNING</a><button id="present-button" class="button button-outline" type="button" aria-pressed="false">▷ Present</button></header>
  <section class="intro" aria-labelledby="page-title"><div><h1 id="page-title">AI in Medicine <em>Monitor</em></h1><p class="intro-question">How far have we come?</p></div><span class="editorial-check" id="editorial-check"></span></section>
  <section id="time-controls" class="time-controls" aria-label="Timeline controls">
    <div class="time-heading"><label for="cutoff-date">Timeline</label><div class="date-controls"><input type="date" id="cutoff-date" min="1950-01-01" max="2030-12-31" aria-label="Date"><button id="today-button" class="small-button" type="button">Today</button></div></div>
    <div class="slider-row"><button id="play-button" class="play-button" type="button" aria-label="Play timeline" aria-pressed="false">▶</button><div class="slider-wrap"><label class="sr-only" for="time-slider">Year</label><input type="range" id="time-slider" min="0" max="80" value="76" step="1"><div class="slider-labels"><span>1950</span><span>2000</span><span>2030</span></div></div><label class="model-control" for="model-filter"><span>Benchmark model</span><select id="model-filter"><option value="">All models</option></select></label></div>
  </section>
  <main id="content"><p class="loading">Loading…</p></main>
  <footer class="site-footer"><span>AI in Medicine Monitor · Gilles Penning</span><button class="text-button" id="export-button" type="button">Export data ↓</button></footer>
</div>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-top"><span class="eyebrow">Evidence</span><button id="close-dialog" class="icon-button" type="button" aria-label="Close">×</button></div><div id="detail-body"></div></dialog>
<p id="live-status" class="sr-only" role="status" aria-live="polite"></p>
<noscript><p class="noscript">JavaScript is required to explore the charts.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
